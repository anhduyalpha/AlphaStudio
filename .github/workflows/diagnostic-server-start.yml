name: Diagnostic server startup

on:
  push:
    branches:
      - diagnostic/server-start-d03497f
  pull_request:
    branches:
      - ux-ui-redesign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-server-smoke:
    name: Node ${{ matrix.node }} production server smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout diagnostic tree
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build client and server
        run: npm run build

      - name: Start production server and verify HTTP
        shell: bash
        env:
          HOST: 127.0.0.1
          PORT: 8787
          SERVE_FRONTEND: 1
          WORKER_POOL_SIZE: 1
          LOG_LEVEL: debug
        run: |
          set -Eeuo pipefail
          node server/dist/index.js > server-start.log 2>&1 &
          server_pid=$!

          cleanup() {
            if kill -0 "$server_pid" 2>/dev/null; then
              kill -TERM "$server_pid" || true
              wait "$server_pid" || true
            fi
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 45); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Server exited before becoming healthy"
              cat server-start.log
              exit 1
            fi

            if curl --fail --silent --show-error http://127.0.0.1:8787/api/health > health.json; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Server did not become healthy within 45 seconds"
            cat server-start.log
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:8787/ > frontend.html
          grep -Eiq 'id="root"|AlphaStudio' frontend.html

          echo "Health response:"
          cat health.json
          echo
          echo "Server log:"
          cat server-start.log

      - name: Upload startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-start-node-${{ matrix.node }}
          if-no-files-found: ignore
          path: |
            server-start.log
            health.json
            frontend.html
